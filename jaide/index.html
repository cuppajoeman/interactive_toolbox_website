<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>Interactive Toolbox</title>
    <meta name="description" content="Interactive Toolbox projects and experiments, built with Jai.">
    <meta name="theme-color" content="#05070d">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root { color-scheme: dark; background: #05070d; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { background: #05070d; color: #eff5fc; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        canvas { display: block; width: 100%; height: 100%; cursor: default; touch-action: none; }
        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: #8da1b9;
            font-size: 0.875rem;
            letter-spacing: 0.08em;
            pointer-events: none;
        }
        .ready #loading { display: none; }
        .screen-reader-nav {
            position: fixed;
            left: -10000px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        .screen-reader-nav:focus-within {
            left: 1rem;
            top: 1rem;
            z-index: 10;
            width: auto;
            height: auto;
            overflow: visible;
            padding: 0.75rem 1rem;
            background: #0b111d;
            border: 1px solid #35c7ad;
        }
        .screen-reader-nav a { color: #eff5fc; margin-right: 1rem; }
    </style>
</head>
<body>
    <nav class="screen-reader-nav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/jaide">Jaide</a>
    </nav>
    <canvas id="canvas" role="application" aria-label="Interactive Toolbox"></canvas>
    <div id="loading" role="status">LOADING INTERACTIVE TOOLBOX…</div>
    <noscript>This site requires JavaScript to run the Jai WebAssembly experience.</noscript>
    <script type="module" src="runtime.js?v=20260915i"></script>
</body>
</html>
